---
# Main quality gate. Bazel pins every tool and owns every gate: the
# hermetic checks are cached `bazel test` targets, so `bazel test //...`
# runs them all, and the few that need the network, Git history or the
# GitHub API run in the shared `repo` job. The shared setup, repository
# checks and conclusion logic come from tbhb-dev/rules. A final `conclusion`
# job gives branch protection one stable required check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux x86_64 and
  # arm64 only.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    defaults:
      run:
        shell: bash
    # Pushes to main use the `cache` environment's shared cache token.
    # Pull requests use the PR token and their own cache namespace.
    environment: ${{ github.event_name == 'push' && 'cache' || '' }}
    steps:
      # Full history lets tools/get_workspace_status.sh stamp the version
      # through `git describe` for builds with --config=release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Hardens the runner, sets up Bazel and fetches, with the platform
      # workarounds, from tbhb-dev/rules. Pushes to main skip the disk cache
      # so Bazel runs the actions and uploads their results to the remote cache.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@60295689201c97560855aebec77af4ff8c836ae9  # main
        with:
          disk-cache: ${{ github.event_name == 'push' && 'false' || format('{0}-{1}', github.workflow, matrix.os) }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Fork pull requests have no token and build without the remote cache.
      - name: Use the remote cache
        uses: tbhb-dev/bazel-r2-cache/.github/actions/remote-cache@ced4cd189a557a2b622a7f0906c55a761a037ba2  # main
        with:
          token: ${{ github.event_name == 'push' && secrets.BAZEL_CACHE_TOKEN || secrets.BAZEL_CACHE_PR_TOKEN }}
          pull-request: ${{ github.event.pull_request.number }}

      # //... is every hermetic gate: the whole-tree lint tests (secrets in
      # the working tree, YAML, TOML, Markdown, prose, EditorConfig,
      # workflows, shell, CODEOWNERS paths), the format check, Starlark
      # lint, nogo during the build, the Go tests and linters, the REUSE
      # check, and the preset staleness test.
      - name: Test
        run: bazelisk test --config=ci //...

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          # The convenience links are dotfiles, which the action skips by default.
          include-hidden-files: true
          if-no-files-found: ignore

  # The repository-level checks, in the shared workflow, on Linux beside the
  # bazel matrix so they don't wait behind the tests: gazelle, MODULE.bazel
  # tidiness, the history scan, zizmor online and CODEOWNERS. govulncheck
  # joins when the first dependency lands.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@60295689201c97560855aebec77af4ff8c836ae9  # main
    with:
      gazelle-dirs: .
      govulncheck-target: ""
      module-dirs: .
      pip-audit-target: ""

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. It passes only when every needed job's
  # result is exactly "success", so a gate that was skipped, cancelled or
  # never finished cannot pass. A matrix with a cancelled leg reports
  # "abandoned", not "cancelled", so the check lists what passes, not what
  # fails.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@60295689201c97560855aebec77af4ff8c836ae9  # main
        with:
          needs: ${{ toJSON(needs) }}
