---
# CodeQL static analysis for the Go source and for the GitHub
# Actions workflows themselves. Runs on every pull request, every
# push to `main`, and weekly so the analysis re-evaluates `main`
# against newly published query updates even when nothing in the
# tree changed. Results upload to the repository's code-scanning
# dashboard as SARIF.
#
# Two languages analyze in parallel matrix slots. `go` builds with
# CodeQL autobuild; the vendored module graph lets `go build ./...`
# resolve without network fetches. `actions` scans the workflow
# files with no build step. Both run the `security-extended` query
# suite, which widens the security ruleset without pulling in the
# code-quality queries that would overlap golangci-lint.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Sunday 03:27 UTC. Off-peak and off the top of the hour
    # so the run avoids the busiest scheduler slots.
    - cron: "27 3 * * 0"
    # Nightly mutation testing uses a separate schedule from CodeQL.
    - cron: "43 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: github.event_name != 'schedule' || github.event.schedule == '27 3 * * 0'
    name: "analyze (${{ matrix.language }})"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the CodeQL results to Code Scanning
      actions: read  # read workflow run details for the analysis
      packages: read  # fetch CodeQL query packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pin the Go toolchain to the version in go.mod so autobuild
      # builds with it instead of the CodeQL bundle's older Go.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"

  # Advisory: known survivors are reported without failing the job.
  # internal/store/store.go:235:16 BRANCH_IF: equivalent; NextSequence cannot fail
  # after earlier writes succeed.
  # internal/store/store.go:259:10 RETURN_ZERO: equivalent; entries is already a nil slice.
  # internal/store/store.go:236:10 RETURN_ERROR_NIL: not covered; needs dependency fault injection.
  # internal/store/store.go:236:37 ERRORF_WRAP: not covered; same fault injection path.
  mutation:
    name: store mutation
    if: github.event_name == 'schedule' && github.event.schedule == '43 4 * * *'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@aa2f970279ca268aea6e6fc7fc3851a5b3d2fc5e  # main
        with:
          disk-cache: nightly-mutation-linux
          cache-save: true

      - name: Test store mutations
        run: bazelisk test --config=ci //:store_mutation_nightly_test --test_output=all

      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: store-mutation-testlogs
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          include-hidden-files: true
          if-no-files-found: ignore
