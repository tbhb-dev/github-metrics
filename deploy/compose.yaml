---
# The receiver, as a Compose project. Start it with deploy/up.sh, which takes
# the published image with its digest (`ghcr.io/<owner>/github-metrics@sha256:...`,
# from the publish workflow's job summary) or the id of a loaded image
# (`sha256:...`) and refuses any other reference, a tag included. Compose alone
# only refuses an unset or empty GITHUB_METRICS_IMAGE.
#
# The service publishes no port. Whatever carries webhook deliveries to it
# joins the `edge` network and reaches it at receiver:8080.
#
# OTEL_EXPORTER_OTLP_ENDPOINT defaults to empty. Setting it drains the stored
# queue, so the host owner must export the stored backlog first.
# METRICS_NETWORK is required and names an existing network on the host.
# Compose reads both from the environment or a .env file beside compose.yaml.
#
# Secrets stay in files. The webhook secret and tunnel token retain host
# ownership through Compose and need uid 65532 with mode 0400. The App key
# source, secrets/github_app_key, stays owned by the deploy account with mode
# 0600. up.sh prepares secrets/runtime/github_app_key with uid 65532 and mode
# 0400 inside a root-owned mode-0700 directory before Compose mounts it.
# Set both GitHub IDs to configure reconciliation. Compose passes the mounted
# key path to the service when GITHUB_APP_ID is set.
# The named `store` volume mounts at `/var/lib/github-metrics`, which the image
# creates owned by 65532:65532 so the receiver can write its store file while
# the root filesystem stays read-only.
#
# The tunnel connector makes outbound connections only. Its route is set in
# Cloudflare, because a token-run connector takes its routes from there. That
# route is a deployment prerequisite for ops to verify: it must send only
# `POST /webhook` to `http://receiver:8080`, because the receiver also serves
# `GET /healthz` without authentication.
#
# `restart: unless-stopped` restarts a container that exits, and does not
# restart one that stays running but unhealthy. The health checks only report.
name: github-metrics

services:
  receiver:
    image: ${GITHUB_METRICS_IMAGE:?start with deploy/up.sh, which sets the image digest}
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      STORE_FILE: /var/lib/github-metrics/store.db
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_APP_KEY_FILE: ${GITHUB_APP_ID:+/run/secrets/github_app_key}
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    volumes:
      - store:/var/lib/github-metrics
      # Docker's embedded DNS refuses requests under gVisor. The deploy
      # supplies a file that lists the upstream resolvers.
      - type: bind
        source: >-
          ${RECEIVER_RESOLV_CONF:?set RECEIVER_RESOLV_CONF to a resolv.conf
          file that lists the upstream resolvers}
        target: /etc/resolv.conf
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - webhook_secret
      - github_app_key
    networks:
      - edge
      - metrics
    healthcheck:
      test: ["CMD", "/github-metrics", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # Use runc because cloudflared cannot resolve DNS under runsc (security debt
    # GM-S-runc). Remove this override when fixed.
    runtime: runc
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      receiver:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

secrets:
  github_app_key:
    file: ./secrets/runtime/github_app_key
  webhook_secret:
    file: ./secrets/webhook_secret
  tunnel_token:
    file: ./secrets/tunnel_token

networks:
  edge: {}
  metrics:
    name: "${METRICS_NETWORK:?set METRICS_NETWORK to the existing collector network}"
    external: true

volumes:
  store: {}
